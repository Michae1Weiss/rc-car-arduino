<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html {
        font-family: Arial;
        display: inline-block;
        margin: 0px auto;
        text-align: center;
      }

      .slidecontainer {
        width: 100%;
      }

      .slider {
        -webkit-appearance: none;
        width: 50%;
        height: 15px;
        border-radius: 5px;
        background: #d3d3d3;
        outline: none;
        opacity: 0.7;
        -webkit-transition: .2s;
        transition: opacity .2s;
      }

      .slider:hover {
        opacity: 1;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background: #4CAF50;
        cursor: pointer;
      }

      .slider::-moz-range-thumb {
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background: #4CAF50;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <h1>ESP8266 BMW CONTROL CENTER (APLHA-TEST)</h1>
    <br><br>
    <div class="slidecontainer">
      <input type="range" min="0" max="180" value="90" class="slider" id="myRange">
      <p>Value : <span id="demo"></span></p>
    </div>

    <script type="text/javascript">
    //Creating a new connection
    var connection = new WebSocket('ws://192.168.4.1:81/', ['arduino']);
    var slider = document.getElementById("myRange");

    var movement = 0; // 0-100
    var wheelDirection = 0; // 0 - 180

    connection.onerror = function (error) {
      console.log('WebSocket Error ', error);
    };
    connection.onmessage = function (e) {
      console.log('Server: ', e.data);
    };
    connection.onclose = function () {
      console.log('WebSocket connection closed');
    };

    function sendDataRotation() {
      output.innerHTML = this.value;
      wheelDirection = slider.value;
      var sum = "r"+wheelDirection+"\r"; //Summing the commands as mentioned.
      console.log("command: "+sum);
      connection.send(sum.toString()); //Sending the number or command so to speak.
    }

    var output = document.getElementById("demo");
    output.innerHTML = slider.value;

    slider.addEventListener("input", sendDataRotation );
    </script>

  </body>
</html>
